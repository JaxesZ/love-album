<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>和你的点点滴滴 - 520 特别相册</title>

    <!-- Apple 专属 Meta 标签 -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%23FFB6C1'/><stop offset='100%' style='stop-color:%23FF69B4'/></linearGradient></defs><rect width='180' height='180' fill='url(%23g)'/><text x='90' y='110' font-size='80' text-anchor='middle' fill='white'>💕</text></svg>">
    <meta name="apple-mobile-web-app-title" content="浪漫相册">
    <meta name="theme-color" content="#FF69B4">

    <!-- iOS 启动画面 -->
    <link rel="apple-touch-startup-image" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 750 1334'><defs><linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%23FFB6C1'/><stop offset='100%' style='stop-color:%23E6E6FA'/></linearGradient></defs><rect width='750' height='1334' fill='url(%23bg)'/><text x='375' y='667' font-size='60' text-anchor='middle' fill='white' font-family='PingFang SC'>和你的点点滴滴</text></svg>">

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/masonry.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- 背景动画层 -->
    <div id="heartAnimationContainer" class="heart-animation-container"></div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 顶部标题区 -->
        <header class="header-section">
            <h1 class="main-title">和你的点点滴滴</h1>
            <p class="sub-title">520 特别相册</p>
        </header>

        <!-- 瀑布流相册展示区 -->
        <section class="album-section">
            <div id="masonryContainer" class="masonry-wrapper">
                <!-- 瀑布流将在这里动态渲染 -->
            </div>

            <!-- 照片数量指示器 -->
            <div class="page-indicator">
                共 <span id="currentPage">0</span> 张甜蜜回忆
                <span id="totalPages" style="display:none"></span>
            </div>
        </section>

        <!-- 操作按钮区 -->
        <section class="controls-section">
            <button id="addPhotoBtn" class="btn btn-primary">
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span>添加照片</span>
            </button>

            <button id="settingsBtn" class="btn btn-secondary">
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v6m0 6v6m8.66-9l-5.2 3m-6.92 4l-5.2 3M21 12h-6m-6 0H3m17.66 5l-5.2-3m-6.92-4l-5.2-3"></path>
                </svg>
                <span>设置</span>
            </button>

            <!-- 隐藏的文件上传输入 -->
            <input type="file" id="photoInput" accept="image/*" multiple style="display: none;">
        </section>
    </div>

    <!-- 设置面板（可展开/收起） -->
    <div id="settingsPanel" class="settings-panel">
        <div class="settings-content">
            <div class="settings-header">
                <h2>设置</h2>
                <button id="closeSettingsBtn" class="close-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="settings-body">
                <!-- 开关选项 -->
                <div class="setting-item">
                    <label class="setting-label">
                        <span>背景动画</span>
                        <div class="toggle-switch">
                            <input type="checkbox" id="toggleAnimation" checked>
                            <span class="toggle-slider"></span>
                        </div>
                    </label>
                </div>

                <!-- 功能按钮 -->
                <div class="settings-actions">
                    <button id="exportBtn" class="settings-btn">
                        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span>导出数据</span>
                    </button>

                    <button id="importBtn" class="settings-btn">
                        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span>导入数据</span>
                    </button>

                    <button id="clearAllBtn" class="settings-btn danger">
                        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        <span>清空所有照片</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 隐藏的导入文件输入 -->
    <input type="file" id="importInput" accept="application/json" style="display: none;">

    <!-- JavaScript Modules -->
    <script src="js/PhotoManager.js"></script>
    <script src="js/MasonryAlbum.js"></script>
    <script src="js/Lightbox.js"></script>
    <script src="js/HeartAnimation.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
